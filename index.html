<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOONKAI — Heroes &amp; Villains</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: auto; box-shadow: 0 0 60px rgba(120, 60, 200, 0.35); }
  #touch { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events: none; z-index: 2; }
  #touch[hidden] { display: none; }
  #touch .cluster { display: grid; gap: 8px; pointer-events: auto; }
  #touch .left { grid-template-columns: repeat(3, 56px); }
  #touch .left [data-key="KeyW"] { grid-column: 2; grid-row: 1; }
  #touch .left [data-key="KeyA"] { grid-column: 1; grid-row: 2; }
  #touch .left [data-key="KeyD"] { grid-column: 3; grid-row: 2; }
  #touch .left [data-key="KeyS"] { grid-column: 2; grid-row: 3; }
  #touch .right { grid-template-columns: repeat(3, 58px); }
  #touch button.big { height: 60px; }
  #touch button { width: 100%; height: 56px; border-radius: 50%; border: 2px solid rgba(255, 211, 90, 0.55);
    background: rgba(20, 14, 40, 0.55); color: #ffe9a8; font: 700 18px/1 Impact, "Arial Black", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #touch button.small { font-size: 13px; letter-spacing: 0.04em; }
  #touch button.big { height: 64px; font-size: 20px; }
  #touch button.form { border-color: rgba(120, 170, 255, 0.7); color: #bcd6ff; }
  #touch button.ult { border-color: rgba(255, 120, 60, 0.8); color: #ffb48a; }
  #touch button.on { background: rgba(255, 211, 90, 0.45); color: #1a0e00; }
  canvas:focus { outline: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="touch" hidden>
  <div class="cluster left">
    <button data-key="KeyA" aria-label="Move left">◀</button>
    <button data-key="KeyW" aria-label="Jump">▲</button>
    <button data-key="KeyD" aria-label="Move right">▶</button>
    <button data-key="KeyS" aria-label="Crouch">▼</button>
  </div>
  <div class="cluster right">
    <button data-key="Escape" class="small" aria-label="Pause">II</button>
    <button data-key="KeyU" class="small form" aria-label="Awaken">FORM</button>
    <button data-key="KeyB" class="small form" aria-label="Sparking blast">SPARK</button>
    <button data-key="KeyP" class="small ult" aria-label="Ultimate">ULT</button>
    <button data-key="Space" class="small" aria-label="Super dash">S.DASH</button>
    <button data-key="KeyH" class="small" aria-label="Vanish">VANISH</button>
    <button data-key="KeyI" class="small" aria-label="Special">SP</button>
    <button data-key="KeyO" class="small ult" aria-label="Super">SUPER</button>
    <button data-key="KeyQ" class="small" aria-label="Assist 1">A1</button>
    <button data-key="KeyJ" class="big" aria-label="Light">L</button>
    <button data-key="KeyK" class="big" aria-label="Medium">M</button>
    <button data-key="KeyL" class="big" aria-label="Heavy">H</button>
  </div>
</div>
